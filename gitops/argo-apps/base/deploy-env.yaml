apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${ARGOCD_ENV_deploy_env_config_app_name}
  namespace: ${ARGOCD_ENV_deploy_env_app_namespace}
  annotations:
    argocd.argoproj.io/sync-wave: ${ARGOCD_ENV_deploy_env_config_sync_wave}

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 10s
        maxDuration: 3m0s
        factor: 2
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ${ARGOCD_ENV_deploy_env_config_namespace}

  source:
    repoURL: ${ARGOCD_ENV_argocd_repo_url}
    targetRevision: ${ARGOCD_ENV_gitlab_application_gitrepo_tag}
    path: gitops/applications/base/deploy-env
    plugin:
      name: envsubst
      env:
        - name: 'gitlab_namespace'
          value: '${ARGOCD_ENV_deploy_env_config_namespace}'

        - name: 'terraform_modules_tag'
          value: '${ARGOCD_ENV_deploy_env_config_terraform_modules_tag}'

        - name: 'environment_list'
          value: '${ARGOCD_ENV_deploy_env_config_environment_list}'

        - name: 'vault_dns_subdomain'
          value: '${ARGOCD_ENV_vault_vault_dns_subdomain}'

        - name: 'nexus_dns_subdomain'
          value: '${ARGOCD_ENV_nexus_nexus_dns_subdomain}'

        - name: 'ceph_dns_subdomain'
          value: '${ARGOCD_ENV_utils_rook_ceph_bucket_config_dns_subdomain}'

        - name: 'monitoring_dns_subdomain'
          value: '${ARGOCD_ENV_monitoring_monitoring_dns_subdomain}'

        - name: 'grafana_dns_subdomain'
          value: '${ARGOCD_ENV_monitoring_grafana_dns_subdomain}'

        - name: 'vault_kv_secret'
          value: '${ARGOCD_ENV_vault_vault_vault_kv_secret}'

        - name: 'gitlab_dns_subdomain'
          value: '${ARGOCD_ENV_gitlab_gitlab_dns_subdomain}'

        - name: 'vault_namespace'
          value: '${ARGOCD_ENV_vault_vault_namespace}'

        - name: 'deploy_env_config_output_secret'
          value: '${ARGOCD_ENV_deploy_env_config_output_secret}'

        - name: 'vault_keys_secret'
          value: '${ARGOCD_ENV_vault_vault_vault_keys_secret}'

        - name: 'vault_tf_provider_version'
          value: '${ARGOCD_ENV_vault_vault_vault_tf_provider_version}'

        - name: 'ceph_max_objects'
          value: '${ARGOCD_ENV_deploy_env_config_ceph_bucket_max_objects}'

        - name: 'ceph_max_size'
          value: '${ARGOCD_ENV_deploy_env_config_ceph_bucket_max_size}'

        - name: 'netbird_version'
          value: '${ARGOCD_ENV_security_netbird_image_version}'

        - name: 'netbird_client_version'
          value: '${ARGOCD_ENV_security_netbird_client_version}'

        - name: 'netbird_dns_subdomain'
          value: '${ARGOCD_ENV_security_netbird_dns_subdomain}'

        - name: 'argocd_namespace'
          value: '${ARGOCD_ENV_utils_argocd_helm_namespace}'

        - name: 'zitadel_dns_subdomain'
          value: '${ARGOCD_ENV_security_zitadel_dns_subdomain}'

        - name: 'kubernetes_oidc_groups_claim'
          value: '${ARGOCD_ENV_security_zitadel_zitadel_grant_prefix}'

        - name: 'cc_cidr_block'
          value: '${ARGOCD_ENV_security_netbird_cc_vpc_cidr}'

        - name: 'sc_cidr_block'
          value: '${ARGOCD_ENV_utils_capi_capi_cluster_cidr}'

        - name: 'sc_cloud_provider'
          value: '${ARGOCD_ENV_utils_capi_cloud_provider}'

        - name: 'env_token_ttl'
          value: '${ARGOCD_ENV_deploy_env_config_env_token_ttl}'

        - name: 'object_storage_endpoint'
          value: '${ARGOCD_ENV_utils_storage_object_storage_host}'

        - name: 'object_storage_regional_endpoint'
          value: '${ARGOCD_ENV_utils_storage_object_storage_regional_host}'

        - name: 'object_storage_region'
          value: '${ARGOCD_ENV_utils_storage_object_storage_region}'

        - name: 'object_storage_path_style'
          value: '${ARGOCD_ENV_utils_storage_object_storage_path_style}'

        - name: 'object_store_insecure_connection'
          value: 'false'

        - name: "object_store_insecure_skip_verify"
          value: "${ARGOCD_ENV_utils_storage_object_store_insecure_skip_verify}"

        - name: 'cc_domain'
          value: '${ARGOCD_ENV_dns_utils_cr_config_dns_private_subdomain}'

        - name: 'sc_domain'
          value: '${ARGOCD_ENV_utils_storage_storage_cluster_domain}'

        - name: 'nexus_readonly_username'
          value: '${ARGOCD_ENV_nexus_nexus_readonly_user_name}'

        - name: 'harbor_dns_subdomain'
          value: '${ARGOCD_ENV_harbor_harbor_dns_subdomain}'

        - name: 'harbor_readonly_username'
          value: '${ARGOCD_ENV_harbor_harbor_readonly_user_name}'

        - name: "capi_cluster_kubeapi_fqdn"
          value: "${ARGOCD_ENV_utils_capi_capi_cluster_kubeapi_fqdn}"

        - name: "capi_cluster_kubeapi_port"
          value: "${ARGOCD_ENV_utils_capi_capi_cluster_kubeapi_port}"

        - name: "nexus_helm_oci_proxy_repos"
          value: "${ARGOCD_ENV_nexus_nexus_helm_oci_proxy_repos}"

        - name: "nexus_helm_classic_proxy_repos"
          value: "${ARGOCD_ENV_nexus_nexus_helm_classic_proxy_repos}"

        - name: "oci_helm_repo_base_url"
          value: "oci://nexusoci.${ARGOCD_ENV_nexus_ui_dns_subdomain}"

        - name: "classic_helm_repo_base_url"
          value: "https://nexus.${ARGOCD_ENV_nexus_ui_dns_subdomain}/repository"

        - name: "env_config_xplane_management_policies"
          value: "${ARGOCD_ENV_deploy_env_config_xplane_management_policies}"
