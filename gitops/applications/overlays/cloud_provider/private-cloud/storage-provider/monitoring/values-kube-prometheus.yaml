#values: https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-80.0.0/charts/kube-prometheus-stack/values.yaml

additionalPrometheusRulesMap:
  percona-pxc-recording-rules:
    groups:
      - name: percona.pxc.backup.job.recording
        interval: 1m
        rules:
          - record: job:percona_pxc_backup_latest_start_time:max
            expr: |
              max by (namespace, owner_name, job_name) (
                kube_job_status_start_time
                * on (namespace, job_name) group_right()
                kube_job_owner{
                  owner_name=~"cron-common-(mojaloop|platform).*",
                  owner_name!~".*mongodb.*",
                  owner_is_controller="true"
                }
              )
              == on (namespace, owner_name) group_left()
              max by (namespace, owner_name) (
                kube_job_status_start_time
                * on (namespace, job_name) group_right()
                kube_job_owner{
                  owner_name=~"cron-common-(mojaloop|platform).*",
                  owner_name!~".*mongodb.*",
                  owner_is_controller="true"
                }
              )

          - record: job:percona_pxc_backup_latest_failed:sum
            expr: |
              clamp_max(job:percona_pxc_backup_latest_start_time:max, 1)
              * on (namespace, job_name) group_left()
              (kube_job_status_failed != 0)

          - record: job:percona_pxc_backup_latest_active:sum
            expr: |
              clamp_max(job:percona_pxc_backup_latest_start_time:max, 1)
              * on (namespace, job_name) group_left()
              (kube_job_status_active > 0)

  percona-pxc-alerts:
    groups:
      - name: percona.pxc.backup.job
        interval: 1m
        rules:
          - alert: PerconaPXCBackupJobFailed
            expr: job:percona_pxc_backup_latest_failed:sum > 0
            for: 2m
            labels:
              severity: critical
              component: database
              db_type: mysql
              layer: infrastructure
            annotations:
              summary: "PXC backup job {{ $labels.job_name }} failed ({{ $labels.namespace }}/{{ $labels.owner_name }})"
              description: |
                K8s Job for CronJob {{ $labels.owner_name }} has failed.
                Namespace: {{ $labels.namespace }}
                Job: {{ $labels.job_name }}

          - alert: PerconaPXCBackupCronJobSuspended
            expr: |
              kube_cronjob_spec_suspend{
                cronjob=~"cron-common-(mojaloop|platform).*",
                cronjob!~".*mongodb.*"
              } == 1
            for: 1h
            labels:
              severity: warning
              component: database
              db_type: mysql
              layer: infrastructure
            annotations:
              summary: "PXC backup CronJob {{ $labels.cronjob }} is suspended"
              description: |
                CronJob has spec.suspend=true - no jobs will run.

prometheusOperator:
  enabled: true
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  logLevel: info
  
  networkPolicy:
    enabled: false

alertmanager:
  enabled: false 
  
prometheus:
  enabled: true
  
  networkPolicy:
    enabled: false
  
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    
    scrapeInterval: ${ARGOCD_ENV_prometheus_scrape_interval}
    evaluationInterval: ${ARGOCD_ENV_prometheus_scrape_interval}
    
    retention: ${ARGOCD_ENV_prometheus_retention_period}
    
    externalLabels:
      cluster: ${ARGOCD_ENV_cluster_label_value}
    
    disableCompaction: false
    additionalArgs:
      - name: storage.tsdb.min-block-duration
        value: ${ARGOCD_ENV_tsdb_min_block_duration}
      - name: storage.tsdb.max-block-duration
        value: ${ARGOCD_ENV_tsdb_max_block_duration}

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: ${ARGOCD_ENV_prometheus_pvc_size}
    
    resources:
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    
    remoteWrite:
      - name: central-monitoring
        url: ${ARGOCD_ENV_prometheus_remote_write_endpoint}/api/v1/push
        headers:
          X-Scope-OrgID: ${ARGOCD_ENV_remote_write_tenant_id}
        metadataConfig:
          sendInterval: ${ARGOCD_ENV_prometheus_scrape_interval}

kubelet:
  enabled: true
  serviceMonitor:
    interval: "${ARGOCD_ENV_prometheus_scrape_interval}"
    metricRelabelings:
      - sourceLabels: ['__name__']
        regex: 'apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket'
        action: drop
      - sourceLabels: ['__name__']
        regex: 'apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket'
        action: drop
      - sourceLabels: ['__name__']
        regex: 'etcd_request_duration_seconds_bucket|apiserver_watch_events_sizes_bucket'
        action: drop
      - sourceLabels: ['__name__']
        regex: 'apiserver_watch_cache_read_wait_seconds_bucket'
        action: drop
      - regex: endpoint|service
        action: labeldrop
    
    relabelings:
      # Add kubernetes_io_hostname label from node label
      - sourceLabels: [node]
        separator: ;
        regex: (.*)
        targetLabel: kubernetes_io_hostname
        replacement: $1
        action: replace
    
    cAdvisorMetricRelabelings:
      - sourceLabels: ['__name__']
        regex: 'container_tasks_state|container_memory_failures_total|container_blkio_device_usage_total'
        action: drop
      - regex: endpoint|service
        action: labeldrop
      - sourceLabels: [name]
        regex: '^[a-f0-9]{64}$'
        targetLabel: name
        replacement: ''
        action: replace

kubeApiServer:
  enabled: false 

kube-state-metrics:
  enabled: true
  
  networkPolicy:
    enabled: false

  prometheus:
    monitor:
      enabled: true
      
      metricRelabelings:
        - regex: uid
          action: labeldrop

      relabelings:
        - sourceLabels: [endpoint]
          regex: http
          targetLabel: endpoint
          replacement: ''
          action: replace
        - sourceLabels: [service]
          regex: prom-kube-state-metrics
          targetLabel: service
          replacement: ''
          action: replace

  rbac:
    create: true
    useClusterRole: true
    extraRules:
      - apiGroups: ["psmdb.percona.com"]
        resources: ["perconaservermongodbbackups"]
        verbs: ["list", "watch"]

  customResourceState:
    enabled: true   
    create: true   
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: psmdb.percona.com
              version: "v1"
              kind: PerconaServerMongoDBBackup
            metricNamePrefix: psmdb_backup
            labelsFromPath:
              backup_name: [metadata, name]
              namespace:   [metadata, namespace]
              cluster:     [spec, clusterName]
              storage:     [spec, storageName]
              type:        [spec, type]       
            metrics:
              - name: "status"
                help: "MongoDB backup status"
                each:
                  type: StateSet
                  stateSet:
                    labelName: status
                    path: [status, state]
                    list: [waiting, requested, running, error, ready]

              - name: "completed_timestamp"
                help: "Unix timestamp when MongoDB backup completed"
                each:
                  type: Gauge
                  gauge:
                    path: [status, completed]
                    valueType: timestamp
                    nilIsZero: true

              - name: "info"
                help: "MongoDB backup destination info"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      destination: [status, destination]


prometheus-node-exporter:
  enabled: true
  
  networkPolicy:
    enabled: false
  
  tolerations:
    - operator: "Exists"
  
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: nodename
        - sourceLabels: [nodename]
          separator: ;
          regex: (.*)
          targetLabel: instance
          replacement: $1
          action: replace
        - regex: endpoint|service
          action: labeldrop

grafana:
  enabled: false

kubeEtcd:
  enabled: false

