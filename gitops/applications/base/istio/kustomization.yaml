apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml

helmCharts:
  - name: base
    releaseName: istio-base
    version: ${ARGOCD_ENV_istio_helm_version}
    repo: https://blob.istio.io/istio-release/charts
    valuesFile: istio-base-values.yaml
    namespace: ${ARGOCD_ENV_istio_namespace}
    includeCRDs: true

  - name: istiod
    releaseName: istiod
    version: ${ARGOCD_ENV_istio_helm_version}
    repo: https://blob.istio.io/istio-release/charts
    valuesFile: istio-istiod-values.yaml
    namespace: ${ARGOCD_ENV_istio_namespace}

  - name: cni
    releaseName: istio-cni
    version: ${ARGOCD_ENV_istio_helm_version}
    repo: https://blob.istio.io/istio-release/charts
    valuesFile: istio-cni-values.yaml
    namespace: ${ARGOCD_ENV_istio_namespace}

  - name: ztunnel
    releaseName: ztunnel
    version: ${ARGOCD_ENV_istio_helm_version}
    repo: https://blob.istio.io/istio-release/charts
    valuesFile: istio-ztunnel-values.yaml
    namespace: ${ARGOCD_ENV_istio_namespace}
