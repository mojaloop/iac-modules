apiVersion: repo-manager.pulpproject.org/v1
kind: Pulp
metadata:
  name: pulp-pull-through-cache
  namespace: pulp
spec:
  # Required fields
  name: pulp-pull-through-cache
  
  # Database configuration (PostgreSQL)
  postgres_configuration_secret: pulp-database-password
  
  # Storage configuration
  storage_access_mode: "ReadWriteOnce"
  
  # API service
  api:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  
  # Content service
  content:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  
  # Worker
  worker:
    replicas: 2
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  
  # Redis cache (optional but recommended)
  redis:
    enabled: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
  
  # File storage sizes
  postgres_storage_size: "10Gi"
  redis_storage_size: "5Gi"
  file_storage_size: "25Gi"
  
  # Secret for Django
  secret_key_secret: pulp-password
  
  # Telemetry
  telemetry:
    enabled: false
  
  # Cache configuration
  cache:
    enabled: true
  
  # Optional: Custom settings
  # custom_settings:
  #   ANSIBLE_API_HOSTNAME: "http://pulp-api-svc:24817"
  #   CONTENT_HOSTNAME: "http://pulp-content-svc:24816"
  #   ALLOW_CONTENT_ACCESS: "true"