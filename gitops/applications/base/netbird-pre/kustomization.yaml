apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - netbird-crs.yaml
  - vault-secrets.yaml
  - netbird-xplane-terraform.yaml
  - stunner-crs.yaml
  - ext-secret-pre.yaml
  - netbird-random-secrets.yaml

helmCharts:
  - name: stunner-gateway-operator
    releaseName: stunner-gateway-operator
    version: ${ARGOCD_ENV_stunner_gateway_operator_helm_version}
    repo: https://l7mp.io/stunner
    namespace: ${ARGOCD_ENV_stunner_system_namespace}
    includeCRDs: true
    valuesInline:
      stunnerGatewayOperator:
        dataplane:
          mode: managed
          spec:
            mode: daemonset
            args:
              - -w
              - --udp-thread-num=8
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            terminationGracePeriodSeconds: 30
