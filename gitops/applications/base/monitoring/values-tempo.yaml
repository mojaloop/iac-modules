
# values: https://github.com/grafana/helm-charts/blob/tempo-distributed-1.47.1/charts/tempo-distributed/values.yaml

storage:
  trace:
    backend: s3
    s3:
      forcepathstyle: ${ARGOCD_ENV_object_storage_path_style}
      endpoint: ${ARGOCD_ENV_object_storage_regional_host}
      insecure: ${ARGOCD_ENV_object_store_insecure_connection}
      bucket: "tempo-${ARGOCD_ENV_dns_hyphenated_subdomain}" 
      region: ${ARGOCD_ENV_cloud_region}
      access_key: $${username}
      secret_key: $${password}
      tls_insecure_skip_verify: ${ARGOCD_ENV_object_store_insecure_skip_verify}


global:
  extraArgs:
  - '-config.expand-env=true'
  extraEnvFrom:
    - secretRef:
        name: "tempo-${ARGOCD_ENV_dns_hyphenated_subdomain}"	



metricsGenerator:
  enabled: true
  replicas: ${ARGOCD_ENV_tempo_metrics_generator_replica_count}
  extraArgs:
  - '-config.expand-env=true' # unfortunately metricsGenerator does not inherit global extraArgs
  extraEnvFrom:
    - secretRef:
        name: "tempo-${ARGOCD_ENV_dns_hyphenated_subdomain}"	
  resources:
    requests:
      cpu: ${ARGOCD_ENV_tempo_metrics_generator_requests_cpu}
      memory: ${ARGOCD_ENV_tempo_metrics_generator_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_tempo_metrics_generator_limits_cpu}
      memory: ${ARGOCD_ENV_tempo_metrics_generator_limits_memory}
  processor:
    local_blocks:                                                                                                                                                  │
│     flush_to_storage: true  

distributor:
  replicas: ${ARGOCD_ENV_tempo_distributor_replica_count}
  resources:
    requests:
      cpu: ${ARGOCD_ENV_tempo_distributor_requests_cpu}
      memory: ${ARGOCD_ENV_tempo_distributor_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_tempo_distributor_limits_cpu}
      memory: ${ARGOCD_ENV_tempo_distributor_limits_memory}

ingester:
  replicas: ${ARGOCD_ENV_tempo_ingester_replica_count}
  config:
    replication_factor: ${ARGOCD_ENV_tempo_ingester_replication_factor} 
  resources:
    requests:
      cpu: ${ARGOCD_ENV_tempo_ingester_requests_cpu}
      memory: ${ARGOCD_ENV_tempo_ingester_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_tempo_ingester_limits_cpu}
      memory: ${ARGOCD_ENV_tempo_ingester_limits_memory}

querier:
  replicas: ${ARGOCD_ENV_tempo_querier_replica_count}
  resources:
    requests:
      cpu: ${ARGOCD_ENV_tempo_querier_requests_cpu}
      memory: ${ARGOCD_ENV_tempo_querier_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_tempo_querier_limits_cpu}
      memory: ${ARGOCD_ENV_tempo_querier_limits_memory}

compactor:
  replicas: ${ARGOCD_ENV_tempo_compactor_replica_count}
  resources:
    requests:
      cpu: ${ARGOCD_ENV_tempo_compactor_requests_cpu}
      memory: ${ARGOCD_ENV_tempo_compactor_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_tempo_compactor_limits_cpu}
      memory: ${ARGOCD_ENV_tempo_compactor_limits_memory}
  config:
    compaction:
      block_retention: ${ARGOCD_ENV_tempo_compactor_block_retention}


queryFrontend:
  replicas: ${ARGOCD_ENV_tempo_query_frontend_replica_count}
  extraArgs:
  - '-config.expand-env=true' # unfortunately queryFrontend does not inherit global extraArgs
  resources:
    requests:
      cpu: ${ARGOCD_ENV_tempo_query_frontend_requests_cpu}
      memory: ${ARGOCD_ENV_tempo_query_frontend_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_tempo_query_frontend_limits_cpu}
      memory: ${ARGOCD_ENV_tempo_query_frontend_limits_memory}


traces:
  jaeger:
    grpc:
      enabled: true
  otlp:
    grpc:
      enabled: true

overrides:
  # -- default config values for all tenants, can be overridden by per-tenant overrides. If a tenant's specific overrides are not found in the `per_tenant_overrides` block, the values in this `default` block will be used. Configs inside this block should follow the new overrides indentation format
  defaults: 
    metrics_generator:
     processors:
      - service-graphs
      - span-metrics
      - local-blocks

metaMonitoring:
  serviceMonitor:
    enabled: true