#values: https://github.com/grafana/mimir/blob/mimir-distributed-6.0.3/operations/helm/charts/mimir-distributed/values.yaml

minio:
  enabled: false

kafka:
  enabled: false

mimir:
  structuredConfig:
    ingest_storage:
      enabled: false
    ingester:
      ring:
        replication_factor: ${ARGOCD_ENV_mimir_ingester_replication_factor}
      push_grpc_method_enabled: true
    blocks_storage:
      tsdb:
        block_ranges_period:
          - 1h
    compactor:
      deletion_delay: ${ARGOCD_ENV_mimir_compactor_deletion_delay}
    limits:
      max_global_series_per_user: ${ARGOCD_ENV_mimir_max_global_series_per_user}
      ingestion_rate: ${ARGOCD_ENV_mimir_ingestion_rate}
      ingestion_burst_size: ${ARGOCD_ENV_mimir_ingestion_burst_size}
      compactor_blocks_retention_period: ${ARGOCD_ENV_mimir_retention_period}
      max_label_names_per_series: ${ARGOCD_ENV_mimir_max_label_names_per_series}
    common:
      storage:
        backend: s3
        s3:
          access_key_id: $${username}
          secret_access_key: $${password}
          bucket_name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"
          endpoint: ${ARGOCD_ENV_object_storage_regional_host}
          insecure: ${ARGOCD_ENV_object_store_insecure_connection}
          bucket_lookup_type: ${ARGOCD_ENV_bucket_lookup_type}
          region: ${ARGOCD_ENV_cloud_region}
          http:
            insecure_skip_verify: ${ARGOCD_ENV_object_store_insecure_skip_verify}
    
    alertmanager_storage:
      storage_prefix: alertmanager
    
    ruler_storage:
      storage_prefix: ruler
    
    # Memberlist configuration (gossip ring)
    memberlist:
      advertise_port: ${ARGOCD_ENV_mimir_gossip_ring_port}
      bind_port: ${ARGOCD_ENV_mimir_gossip_ring_port}

# Metrics and monitoring
metaMonitoring:
  serviceMonitor:
    enabled: true
    labels:
      prometheus: kube-prometheus
    relabelings:
      - sourceLabels: [namespace, job]
        separator: /
        regex: (.*)
        targetLabel: job
        replacement: $${1}
        action: replace
    jobLabel: 'app.kubernetes.io/component'

distributor:
  replicas: ${ARGOCD_ENV_mimir_distributor_replica_count}
  resources:
    requests:
      cpu: ${ARGOCD_ENV_mimir_distributor_requests_cpu}
      memory: ${ARGOCD_ENV_mimir_distributor_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_mimir_distributor_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_distributor_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"

ingester:
  replicas: ${ARGOCD_ENV_mimir_ingester_replica_count}
  resources:
    requests:
      cpu: ${ARGOCD_ENV_mimir_ingester_requests_cpu}
      memory: ${ARGOCD_ENV_mimir_ingester_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_mimir_ingester_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_ingester_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  persistentVolume:
    enabled: true
    size: ${ARGOCD_ENV_mimir_ingester_storage_size}
  zoneAwareReplication:
    enabled: false  

querier:
  replicas: ${ARGOCD_ENV_mimir_querier_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_mimir_querier_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_querier_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"

query_frontend:
  replicas: ${ARGOCD_ENV_mimir_query_frontend_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_mimir_query_frontend_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_query_frontend_limits_memory}

compactor:
  replicas: ${ARGOCD_ENV_mimir_compactor_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_mimir_compactor_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_compactor_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  persistentVolume:
    enabled: true
    size: ${ARGOCD_ENV_mimir_compactor_storage_size}

store_gateway:
  replicas: ${ARGOCD_ENV_mimir_store_gateway_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_mimir_store_gateway_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_store_gateway_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  persistentVolume:
    enabled: true
    size: ${ARGOCD_ENV_mimir_store_gateway_storage_size}
  zoneAwareReplication:
    enabled: false  

ruler:
  enabled: true
  replicas: ${ARGOCD_ENV_mimir_ruler_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_mimir_ruler_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_ruler_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"

alertmanager:
  enabled: true
  replicas: ${ARGOCD_ENV_mimir_alertmanager_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_mimir_alertmanager_limits_cpu}
      memory: ${ARGOCD_ENV_mimir_alertmanager_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "mimir-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  persistentVolume:
    enabled: true
    size: ${ARGOCD_ENV_mimir_alertmanager_storage_size}
  zoneAwareReplication:
    enabled: false  

gateway:
  enabledNonEnterprise: true
  dnsConfig:
    resolver: 169.254.20.10

# Memcached configuration
chunks-cache:
  enabled: true
  resources:
    requests:
      memory: 256Mi

index-cache:
  enabled: true

metadata-cache:
  enabled: true

results-cache:
  enabled: true

rollout_operator:
  enabled: false

# Global settings
# global:
#   dnsService: "external-dns" 
#   dnsNamespace: "ext-dns"

# Runtime configuration for memberlist (gossip ring)
runtimeConfig: {}

# Service accounts
serviceAccount:
  create: true
  name: ""

# RBAC
rbac:
  create: true
  pspEnabled: false

# Network policies - disabled
networkPolicy:
  enabled: false
  ingress:
    - {}
  egress:
    - {}