# values: https://github.com/grafana/loki/blob/helm-loki-6.45.2/production/helm/loki/values.yaml

deploymentMode: Distributed

loki:
  auth_enabled: false
  extraArgs:
    - -config.expand-env=true
  # NEW SCHEMA - tsdb/v13 with different prefix from old boltdb-shipper
  schemaConfig:
    configs:
      - from: "2024-11-04"  # Use today's date for new schema start
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: tsdb_index_  # Different from old 'index_'
          period: 24h
  
  # SAME S3 BUCKET - but with proper path separation
  storage:
    type: s3
    bucketNames:
      chunks: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"  
      ruler: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
      admin: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
    s3:
      endpoint: ${ARGOCD_ENV_object_storage_regional_host}
      region: ${ARGOCD_ENV_cloud_region}
      accessKeyId: $${username}
      secretAccessKey: $${password}
      s3ForcePathStyle: ${ARGOCD_ENV_object_storage_path_style}
      insecure: ${ARGOCD_ENV_object_store_insecure_connection}
      http_config:
        insecure_skip_verify: ${ARGOCD_ENV_object_store_insecure_skip_verify}

  server:
    grpc_server_max_recv_msg_size: 8388608  # 8MB

  limits_config:
    retention_period: ${ARGOCD_ENV_loki_retention_period}
    volume_enabled: true

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: s3


  ingester:
    max_chunk_age: ${ARGOCD_ENV_loki_ingester_max_chunk_age}
    chunk_encoding: snappy
    lifecycler:
      ring:
        replication_factor: ${ARGOCD_ENV_loki_ingester_replication_factor}

  memberlistConfig:
    join_members:
      - "loki-memberlist:7946"


  commonConfig:
    replication_factor: ${ARGOCD_ENV_loki_ingester_replication_factor}

  # TSDB Shipper config - this separates from boltdb-shipper paths
  storage_config:
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
    hedging:
      at: "250ms"
      max_per_second: 20
      up_to: 3

  rulerConfig:
    enable_api: true
    enable_alertmanager_v2: false  
    wal:
      dir: /var/loki/ruler-wal
    storage:
      type: local 
      local:
        directory: /etc/loki/rules
    rule_path: /tmp/rules
    ring:
      kvstore:
        store: memberlist 
    # How often to evaluate rules
    evaluation_interval: 5m
    # How often to poll for rule changes from storage
    poll_interval: 5m
    remote_write:
      enabled: true
      clients:
        prometheus:
          url: http://prometheus-operated:9090/api/v1/write

# Global extraEnvFrom for all components
global:
  dnsService: "external-dns" 
  dnsNamespace: "ext-dns"
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"

# Ingester configuration
ingester:
  replicas: ${ARGOCD_ENV_loki_ingester_replica_count}
  maxUnavailable: 1
  resources:
    requests:
      cpu: ${ARGOCD_ENV_loki_ingester_requests_cpu}
      memory: ${ARGOCD_ENV_loki_ingester_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_loki_ingester_limits_cpu}
      memory: ${ARGOCD_ENV_loki_ingester_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  persistence:
    enabled: true
    size: 10Gi
  zoneAwareReplication:
    enabled: false
  extraArgs:
    - -config.expand-env=true

# Distributor configuration
distributor:
  replicas: ${ARGOCD_ENV_loki_distributor_replica_count}
  maxUnavailable: 1
  resources:
    requests:
      cpu: ${ARGOCD_ENV_loki_distributor_requests_cpu}
      memory: ${ARGOCD_ENV_loki_distributor_requests_memory}
    limits:
      cpu: ${ARGOCD_ENV_loki_distributor_limits_cpu}
      memory: ${ARGOCD_ENV_loki_distributor_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  extraArgs:
    - -config.expand-env=true

# Querier configuration
querier:
  replicas: ${ARGOCD_ENV_loki_querier_replica_count}
  maxUnavailable: 1
  resources:
    limits:
      cpu: ${ARGOCD_ENV_loki_querier_limits_cpu}
      memory: ${ARGOCD_ENV_loki_querier_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  extraArgs:
    - -config.expand-env=true

# Query Frontend configuration
queryFrontend:
  replicas: ${ARGOCD_ENV_loki_query_frontend_replica_count}
  maxUnavailable: 1
  resources:
    limits:
      cpu: ${ARGOCD_ENV_loki_query_frontend_limits_cpu}
      memory: ${ARGOCD_ENV_loki_query_frontend_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  extraArgs:
    - -config.expand-env=true

# Query Scheduler configuration
queryScheduler:
  replicas: ${ARGOCD_ENV_loki_query_scheduler_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_loki_query_scheduler_limits_cpu}
      memory: ${ARGOCD_ENV_loki_query_scheduler_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  extraArgs:
    - -config.expand-env=true

# Compactor configuration
compactor:
  replicas: ${ARGOCD_ENV_loki_compactor_replica_count}
  resources:
    limits:
      cpu: ${ARGOCD_ENV_loki_compactor_limits_cpu}
      memory: ${ARGOCD_ENV_loki_compactor_limits_memory}
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  persistence:
    enabled: true
    size: 10Gi
  extraArgs:
    - -config.expand-env=true
  

# Ruler configuration
ruler:
  enabled: true
  replicas: 1
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  extraArgs:
    - -config.expand-env=true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
  nodeAffinityPreset:
    type: hard
    key: workload-class.mojaloop.io/MONITORING
    values: ["enabled"]
  extraVolumes:
    - name: rules-tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: rules-tmp
      mountPath: /tmp/rules
  directories:
    fake: 
      rules.yaml: |
        groups:
          # === 1. NUMBER OF LINES METRICS ===
          - name: log_lines_metrics
            interval: 5m
            rules:
              # Total lines per namespace
              - record: loki_lines_total_by_namespace
                expr: |
                  sum by (namespace) (
                    rate({namespace=~".+"} [5m])
                  )
              
              # Lines per namespace and app
              - record: loki_lines_total_by_namespace_app
                expr: |
                  sum by (namespace, app) (
                    rate({namespace=~".+", app=~".+"} [5m])
                  )
              
              # Lines per namespace, app, and pod
              - record: loki_lines_total_by_namespace_app_pod
                expr: |
                  sum by (namespace, app, pod) (
                    rate({namespace=~".+", app=~".+", pod=~".+"} [5m])
                  )
              
              # Lines per namespace, app, pod, and container
              - record: loki_lines_total_by_namespace_app_pod_container
                expr: |
                  sum by (namespace, app, pod, container) (
                    rate({namespace=~".+", app=~".+", pod=~".+", container=~".+"} [5m])
                  )
              
              # Lines per pod (simpler, commonly used)
              - record: loki_lines_total_by_pod
                expr: |
                  sum by (namespace, pod) (
                    rate({pod=~".+"} [5m])
                  )
          
          # === 2. NUMBER OF BYTES METRICS ===
          - name: log_bytes_metrics
            interval: 5m
            rules:
              # Total bytes per namespace
              - record: loki_bytes_total_by_namespace
                expr: |
                  sum by (namespace) (
                    bytes_rate({namespace=~".+"} [5m])
                  )
              
              # Bytes per namespace and app
              - record: loki_bytes_total_by_namespace_app
                expr: |
                  sum by (namespace, app) (
                    bytes_rate({namespace=~".+", app=~".+"} [5m])
                  )
              
              # Bytes per namespace, app, and pod
              - record: loki_bytes_total_by_namespace_app_pod
                expr: |
                  sum by (namespace, app, pod) (
                    bytes_rate({namespace=~".+", app=~".+", pod=~".+"} [5m])
                  )
              
              # Bytes per namespace, app, pod, and container
              - record: loki_bytes_total_by_namespace_app_pod_container
                expr: |
                  sum by (namespace, app, pod, container) (
                    bytes_rate({namespace=~".+", app=~".+", pod=~".+", container=~".+"} [5m])
                  )
              
              # Bytes per pod (simpler, commonly used)
              - record: loki_bytes_total_by_pod
                expr: |
                  sum by (namespace, pod) (
                    bytes_rate({pod=~".+"} [5m])
                  )
          
          # === 3. ERROR LINES METRICS ===
          - name: log_error_metrics
            interval: 5m
            rules:
              # Error lines per namespace
              - record: loki_error_lines_by_namespace
                expr: |
                  sum by (namespace) (
                    rate({namespace=~".+"} |~ "(?i)level.*(error|err)" [5m])
                  )
              
              # Error lines per namespace and app
              - record: loki_error_lines_by_namespace_app
                expr: |
                  sum by (namespace, app) (
                    rate({namespace=~".+", app=~".+"} |~ "(?i)level.*(error|err)" [5m])
                  )
              
              # Error lines per namespace, app, and pod
              - record: loki_error_lines_by_namespace_app_pod
                expr: |
                  sum by (namespace, app, pod) (
                    rate({namespace=~".+", app=~".+", pod=~".+"} |~ "(?i)level.*(error|err)" [5m])
                  )
              
              # Error lines per namespace, app, pod, and container
              - record: loki_error_lines_by_namespace_app_pod_container
                expr: |
                  sum by (namespace, app, pod, container) (
                    rate({namespace=~".+", app=~".+", pod=~".+", container=~".+"} |~ "(?i)level.*(error|err)" [5m])
                  )
              
              # Error lines per pod (simpler)
              - record: loki_error_lines_by_pod
                expr: |
                  sum by (namespace, pod) (
                    rate({pod=~".+"} |~ "(?i)level.*(error|err)" [5m])
                  )
                  
# Gateway configuration
gateway:
  enabled: true
  replicas: 1
  verboseLogging: true
  service:
    type: ClusterIP
    port: 80

# Index Gateway (required for TSDB)
indexGateway:
  enabled: true
  replicas: 1
  extraEnvFrom:
    - secretRef:
        name: "loki-${ARGOCD_ENV_dns_hyphenated_subdomain}"
  persistence:
    enabled: true
    size: 10Gi

# Chunks Cache (Memcached)
chunksCache:
  enabled: true
  replicas: 1
  allocatedMemory: 1400
  maxItemMemory: 5

# Results Cache (Memcached)
resultsCache:
  enabled: true
  replicas: 1
  allocatedMemory: 1024

# Monitoring
monitoring:
  serviceMonitor:
    enabled: true
    interval: ${ARGOCD_ENV_prometheus_scrape_interval}
  rules:
    enabled: false
  dashboards:
    enabled: false

# Loki Canary
lokiCanary:
  enabled: true

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
