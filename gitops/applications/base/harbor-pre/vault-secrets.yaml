apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-ansible-secret-vars
  namespace: ${ARGOCD_ENV_vault_namespace}
spec:
  refreshInterval: 1m

  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store

  target:
    name: harbor-ansible-secret-vars
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        inventory: |
          all:
            hosts:
             localhost:
               ansible_host: 127.0.0.1
            vars:
              admin_password: {{ .admin_password  | toString }}
              readonly_user_password: {{ .readonly_user_password  | toString }}
              readonly_user_name: "${ARGOCD_ENV_harbor_readonly_user_name}"
              harbor_url: harbor.harbor.svc.cluster.local:80
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "${ARGOCD_ENV_harbor_namespace}"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true" # Auto create reflection for matching namespaces
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "${ARGOCD_ENV_harbor_namespace}"          

  data:
    - secretKey: admin_password
      remoteRef: 
        key: harbor/harbor-password
        property: password
    - secretKey: readonly_user_password
      remoteRef: 
        key: harbor/external-docker-harbor-password
        property: password