apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana-ui
  namespace: ${ARGOCD_ENV_monitoring_namespace}
spec:
  gateways:
    - ${ARGOCD_ENV_grafana_istio_gateway_namespace}/${ARGOCD_ENV_grafana_istio_wildcard_gateway_name}
  hosts:
    - "grafana.${ARGOCD_ENV_grafana_dns_subdomain}"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: grafana-service
            port:
              number: 3000

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: mimir-gateway
  namespace: ${ARGOCD_ENV_monitoring_namespace}
spec:
  gateways:
    - ${ARGOCD_ENV_mimir_istio_gateway_namespace}/${ARGOCD_ENV_mimir_istio_wildcard_gateway_name}
  hosts:
    - "mimir.${ARGOCD_ENV_mimir_dns_subdomain}"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: central-monitoring-mimir-gateway
            port:
              number: 8080
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: loki-gateway
  namespace: ${ARGOCD_ENV_monitoring_namespace}
spec:
  gateways:
    - ${ARGOCD_ENV_mimir_istio_gateway_namespace}/${ARGOCD_ENV_mimir_istio_wildcard_gateway_name} # TODO: use monitoring subdomain
  hosts:
    - "loki.${ARGOCD_ENV_grafana_dns_subdomain}"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: loki-gateway
            port:
              number: 80
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: traces-gateway
  namespace: ${ARGOCD_ENV_monitoring_namespace}
spec:
  gateways:
    - ${ARGOCD_ENV_mimir_istio_gateway_namespace}/${ARGOCD_ENV_mimir_istio_wildcard_gateway_name} # TODO: use monitoring subdomain
  hosts:
    - "traces.${ARGOCD_ENV_grafana_dns_subdomain}"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: central-tempo-distributor
            port:
              number: 4317
