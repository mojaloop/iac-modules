reportsController:
  rbac:
    coreClusterRole:
      extraResources:
      - apiGroups:
        - '*'
        resources:
        - '*'
        verbs:
        - get
        - list
        - watch
  resources:
    limits:
      memory: 256Mi

backgroundController:
  rbac:
    coreClusterRole:
      extraResources:
        - apiGroups:
            - "apps"
          resources:
            - "deployments"
          verbs:
            - get
            - list
            - watch
            - update
            - patch
        - apiGroups:
            - "coordination.k8s.io"
          resources:
            - "leases"
          verbs:
            - get
            - list
            - watch
            - create
            - delete
            - patch
            - update

cleanupController:
  resources:
    # -- Pod resource limits
    limits:
      memory: 256Mi
    # -- Pod resource requests
    requests:
      cpu: 100m
      memory: 128Mi

admissionController:
  rbac:
    coreClusterRole:
      extraResources:
        - apiGroups:
            - "coordination.k8s.io"
          resources:
            - "leases"
          verbs:
            - get
            - list
            - watch