cluster:
  name: ${ARGOCD_ENV_netbird_operator_cluster_name}
ingress:
  enabled: true
  router:
    enabled: true
    replicas: ${ARGOCD_ENV_netbird_operator_router_replica_count}
  kubernetesAPI:
    enabled: false
netbirdAPI:
  keyFromSecret:
    name: ${ARGOCD_ENV_netbird_operator_api_key_secret}
    key: NB_API_KEY
managementURL: ${ARGOCD_ENV_netbird_operator_management_url}
webhook:
  failurePolicy: Ignore
routingClientImage: netbirdio/netbird:${ARGOCD_ENV_netbird_image_version}
