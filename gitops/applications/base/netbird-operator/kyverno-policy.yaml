apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nbrouter-port-leaser
spec:
  applyRules: All
  rules:
    # RULE 1: MUTATE THE POD (This happens during admission)
    - name: mutate-router-port
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["${ARGOCD_ENV_netbird_operator_namespace}"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      preconditions:
        all:
        - key: "{{request.operation}}"
          operator: Equals
          value: CREATE
      context:
          # 1. Fetch existing leases - Use the default operator `||` to ensure an array
          - name: takenPorts
            apiCall:
              urlPath: "/apis/coordination.k8s.io/v1/namespaces/{{request.namespace}}/leases"
              # The backticks around [] are critical for JMESPath to recognize it as a literal array
              jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name || `[]`"
          
          # 2. Convert the comma-separated string
          - name: allPorts
            variable:
              value: "{{ split('${ARGOCD_ENV_netbird_operator_router_port_range}', ',') }}"
          
          # 3. Use to_string(@) inside join to ensure type compatibility
          - name: targetPort
            variable:
              value: "{{ allPorts[? !contains(takenPorts, join('', ['port-', to_string(@)]))] | [0] }}"

      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/containers/0/ports"
            value: 
            - containerPort: 51820
              hostPort: {{ targetPort | to_number(@) }}
              protocol: UDP
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_EXTERNAL_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_LISTEN_PORT", "value": "{{targetPort}}"}
          - op: add
            path: "/spec/securityContext"
            value: {"sysctls": [{"name": "net.ipv4.ip_forward", "value": "1"}]}

    # RULE 2: GENERATE THE LEASE (This happens after the pod is admitted)
    - name: generate-port-lease
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["${ARGOCD_ENV_netbird_operator_namespace}"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
          # 1. Fetch existing leases - Use the default operator `||` to ensure an array
          - name: takenPorts
            apiCall:
              urlPath: "/apis/coordination.k8s.io/v1/namespaces/{{request.namespace}}/leases"
              # The backticks around [] are critical for JMESPath to recognize it as a literal array
              jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name || `[]`"
          
          # 2. Convert the comma-separated string
          - name: allPorts
            variable:
              value: "{{ split('${ARGOCD_ENV_netbird_operator_router_port_range}', ',') }}"
          
          # 3. Use to_string(@) inside join to ensure type compatibility
          - name: targetPort
            variable:
              value: "{{ allPorts[? !contains(takenPorts, join('', ['port-', to_string(@)]))] | [0] }}"
      generate:
        apiVersion: coordination.k8s.io/v1
        kind: Lease
        name: "port-{{targetPort}}"
        namespace: "{{request.namespace}}"
        synchronize: true
        data:
          metadata:
            labels:
              type: nb-port-lease
              assigned-to: "{{request.object.metadata.name}}"
            ownerReferences:
            - apiVersion: v1
              kind: Pod
              name: "{{request.object.metadata.name}}"
              uid: "{{request.object.metadata.uid}}"
          spec:
            holderIdentity: "{{request.object.metadata.name}}"
            leaseDurationSeconds: 30
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-netbird-operator
  annotations:
    policies.kyverno.io/title: Restart netbird operator pod on secret update
    policies.kyverno.io/description: >-
      This policy requires the restart of netbird operator pod when the secret is updated
    argocd.argoproj.io/sync-wave: "0"
spec:
  rules:
    - name: add-annotation-on-secret-update
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - ${ARGOCD_ENV_netbird_operator_api_key_secret}
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  kyverno.platform.mojaloop.com/triggerrestart: "{{request.object.metadata.resourceVersion}}"
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: ${ARGOCD_ENV_netbird_operator_namespace}
            selector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-operator
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
  validationFailureAction: Audit
