apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nbrouter-port-leaser
spec:
  applyRules: All
  rules:
    - name: mutate-router-port
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["netbird-op"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        - name: takenPorts
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/netbird-op/leases"
            jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name || `[]`"
        
        - name: allPorts
          variable:
            value: ["51820", "51821", "51822", "51823", "51824", "51825", "51826", "51827", "51828", "51829", "51830"]

        # Use the UID to ensure uniqueness during admission
        - name: podUid
          variable:
            value: "{{ request.object.metadata.uid || '0' }}"

        # Use the split/join trick to get the very last character as a string
        - name: seedChar
          variable:
            value: "{{ podUid | split(@, '') | [-1] }}"
        
        # Convert character to index 0-35
        - name: seedIndex
          variable:
            value: "{{ index('0123456789abcdefghijklmnopqrstuvwxyz', seedChar) || `0` }}"

        # Select port: Try the seed index first. If taken, the filter will shift. 
        - name: targetPort
          variable:
            value: >-
              {{ (allPorts[? !contains(takenPorts || `[]`, join('', ['port-', to_string(@)]))] | [seedIndex]) || 
                 (allPorts[? !contains(takenPorts || `[]`, join('', ['port-', to_string(@)]))] | [0]) }}

      preconditions:
        all:
        - key: "{{request.operation}}"
          operator: Equals
          value: CREATE
        - key: "{{targetPort}}"
          operator: NotEquals
          value: ""

      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/containers/0/ports"
            value: 
            - containerPort: 51820
              hostPort: {{ targetPort | to_number(@) }}
              protocol: UDP
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_EXTERNAL_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_LISTEN_PORT", "value": "{{targetPort}}"}
          - op: add
            path: "/spec/securityContext"
            value: {"sysctls": [{"name": "net.ipv4.ip_forward", "value": "1"}]}

    - name: generate-port-lease
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["netbird-op"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        - name: takenPorts
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/netbird-op/leases"
            jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name || `[]`"
        - name: allPorts
          variable:
            value: ["51820", "51821", "51822", "51823", "51824", "51825", "51826", "51827", "51828", "51829", "51830"]
        - name: podUid
          variable:
            value: "{{ request.object.metadata.uid || '0' }}"
        - name: seedChar
          variable:
            value: "{{ podUid | split(@, '') | [-1] }}"
        - name: seedIndex
          variable:
            value: "{{ index('0123456789abcdefghijklmnopqrstuvwxyz', seedChar) || `0` }}"
        - name: targetPort
          variable:
            value: >-
              {{ (allPorts[? !contains(takenPorts || `[]`, join('', ['port-', to_string(@)]))] | [seedIndex]) || 
                 (allPorts[? !contains(takenPorts || `[]`, join('', ['port-', to_string(@)]))] | [0]) }}
      generate:
        apiVersion: coordination.k8s.io/v1
        kind: Lease
        name: "port-{{targetPort}}"
        namespace: "netbird-op"
        synchronize: true
        data:
          metadata:
            labels:
              type: nb-port-lease
            ownerReferences:
            - apiVersion: v1
              kind: Pod
              name: "{{request.object.metadata.name}}"
              uid: "{{request.object.metadata.uid}}"
          spec:
            holderIdentity: "{{request.object.metadata.name}}"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-netbird-operator
  annotations:
    policies.kyverno.io/title: Restart netbird operator pod on secret update
    policies.kyverno.io/description: >-
      This policy requires the restart of netbird operator pod when the secret is updated
    argocd.argoproj.io/sync-wave: "0"
spec:
  rules:
    - name: add-annotation-on-secret-update
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - ${ARGOCD_ENV_netbird_operator_api_key_secret}
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  kyverno.platform.mojaloop.com/triggerrestart: "{{request.object.metadata.resourceVersion}}"
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: ${ARGOCD_ENV_netbird_operator_namespace}
            selector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-operator
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
  validationFailureAction: Audit
