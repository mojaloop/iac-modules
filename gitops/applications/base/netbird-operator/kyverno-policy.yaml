apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nbrouter-add-security-context
spec:
  rules:
    - name: nbrouter-add-security-context
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["${ARGOCD_ENV_netbird_operator_namespace}"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        # 1. Look up the HostPortClaim (Namespaced Resource)
        - name: hpc_resource
          apiCall:
            # Format: /apis/<group>/<version>/namespaces/<ns>/<kind>/<name>
            urlPath: "/apis/://hostport.rmb938.com{{request.namespace}}/hostportclaims/netbird-{{ request.object.metadata.ownerReferences[0].name | split(@, '-') | [0:-1] | join('-', @) }}"
            jmesPath: "spec.hostPortName"

        # 2. Look up the HostPort (Cluster-Scoped Resource)
        - name: hp_resource
          apiCall:
            # Format: /apis/<group>/<version>/<kind>/<name>
            urlPath: "/apis/://hostport.rmb938.com{{ hpc_resource }}"
            jmesPath: "spec.port"

      mutate:
        patchesJson6902: |-
          - op: add
            path: /metadata/annotations/claim.hostport.rmb938.com~1router
            value: "netbird-{{ request.object.metadata.ownerReferences[0].name | split(@, '-') | [0:-1] | join('-', @) }}"
          # Inject the ACTUAL port into the spec immediately
          - op: add
            path: "/spec/containers/0/ports"
            value: 
            - name: router
              containerPort: 51820
              hostPort: {{ hp_resource }}
              protocol: UDP
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_EXTERNAL_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}
          # Static injection of the port into the ENV (more reliable than fieldRef for annotations)
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_LISTEN_PORT", "value": "{{ hp_resource }}"}
          - op: add
            path: "/spec/securityContext"
            value: {"sysctls": [{"name": "net.ipv4.ip_forward", "value": "1"}]}
      preconditions:
        any:
          - key: "{{request.operation}}"
            operator: In
            value: ["CREATE", "UPDATE"]
      skipBackgroundRequests: true
  validationFailureAction: Audit
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-netbird-operator
  annotations:
    policies.kyverno.io/title: Restart netbird operator pod on secret update
    policies.kyverno.io/description: >-
      This policy requires the restart of netbird operator pod when the secret is updated
    argocd.argoproj.io/sync-wave: "0"
spec:
  rules:
    - name: add-annotation-on-secret-update
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - ${ARGOCD_ENV_netbird_operator_api_key_secret}
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  kyverno.platform.mojaloop.com/triggerrestart: "{{request.object.metadata.resourceVersion}}"
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: ${ARGOCD_ENV_netbird_operator_namespace}
            selector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-operator
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
  validationFailureAction: Audit
