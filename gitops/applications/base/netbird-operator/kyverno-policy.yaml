apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nbrouter-port-leaser
spec:
  rules:
    - name: generate-port-lease
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["${ARGOCD_ENV_netbird_operator_namespace}"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        # 1. Fetch existing leases to see what is taken
        - name: takenPorts
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/{{request.namespace}}/leases"
            jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name"
        
        # 2. Parse range and find first available port
        - name: portRange
          variable:
            value: "${ARGOCD_ENV_netbird_operator_router_port_range}"
        
        - name: startPort
          variable:
            value: "{{ split(portRange, '-')[0] | to_number(@) }}"
            
        - name: endPort  
          variable:
            value: "{{ split(portRange, '-')[1] | to_number(@) }}"
            
        # Generate array of ports manually for common ranges
        - name: allPorts
          variable:
            value: >-
              {{ startPort == `51820` && endPort == `51830` && [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`, `51826`, `51827`, `51828`, `51829`, `51830`] ||
                 startPort == `51820` && endPort == `51825` && [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`] ||
                 [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`, `51826`, `51827`, `51828`, `51829`, `51830`] }}
        
        - name: targetPort
          variable:
            value: >-
              {{ allPorts | [? !contains(takenPorts, join('', ['port-', to_string(@)]))] | [0] }}

      # Generate the Lease object linked to the Pod for auto-cleanup
      generate:
        apiVersion: coordination.k8s.io/v1
        kind: Lease
        name: "port-{{targetPort}}"
        namespace: "{{request.namespace}}"
        data:
          metadata:
            labels:
              type: nb-port-lease
              assigned-to: "{{request.object.metadata.name}}"
            ownerReferences:
            - apiVersion: v1
              kind: Pod
              name: "{{request.object.metadata.name}}"
              uid: "{{request.object.metadata.uid}}"
          spec:
            holderIdentity: "{{request.object.metadata.name}}"
            leaseDurationSeconds: 30

    - name: mutate-pod-with-port
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["${ARGOCD_ENV_netbird_operator_namespace}"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        # Re-fetch the same port logic for the mutation
        - name: takenPorts
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/{{request.namespace}}/leases"
            jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name"
        
        - name: portRange
          variable:
            value: "${ARGOCD_ENV_netbird_operator_router_port_range}"
        
        - name: startPort
          variable:
            value: "{{ split(portRange, '-')[0] | to_number(@) }}"
            
        - name: endPort  
          variable:
            value: "{{ split(portRange, '-')[1] | to_number(@) }}"
            
        - name: allPorts
          variable:
            value: >-
              {{ startPort == `51820` && endPort == `51830` && [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`, `51826`, `51827`, `51828`, `51829`, `51830`] ||
                 startPort == `51820` && endPort == `51825` && [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`] ||
                 [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`, `51826`, `51827`, `51828`, `51829`, `51830`] }}
        
        - name: targetPort
          variable:
            value: >-
              {{ allPorts | [? !contains(takenPorts, join('', ['port-', to_string(@)]))] | [0] }}

      # Mutate the Pod to use the discovered port
      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/containers/0/ports"
            value: 
            - containerPort: 51820
              hostPort: {{targetPort}}
              protocol: UDP
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_EXTERNAL_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_LISTEN_PORT", "value": "{{targetPort}}"}
          - op: add
            path: "/spec/securityContext"
            value: {"sysctls": [{"name": "net.ipv4.ip_forward", "value": "1"}]}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-netbird-operator
  annotations:
    policies.kyverno.io/title: Restart netbird operator pod on secret update
    policies.kyverno.io/description: >-
      This policy requires the restart of netbird operator pod when the secret is updated
    argocd.argoproj.io/sync-wave: "0"
spec:
  rules:
    - name: add-annotation-on-secret-update
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - ${ARGOCD_ENV_netbird_operator_api_key_secret}
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  kyverno.platform.mojaloop.com/triggerrestart: "{{request.object.metadata.resourceVersion}}"
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: ${ARGOCD_ENV_netbird_operator_namespace}
            selector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-operator
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
  validationFailureAction: Audit
