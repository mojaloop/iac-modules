      context:
        # 1. Fetch existing leases
        - name: takenPorts
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/{{request.namespace}}/leases"
            jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name"
        
        # 2. Convert the comma-separated string into a clean array of strings
        # Example: "5000, 5001, 5003" -> ["5000", "5001", "5003"]
        - name: allPorts
          variable:
            value: "{{ split('${ARGOCD_ENV_netbird_operator_router_port_range}', ',') | map(&trim(@, ' '), @) }}"
        
        # 3. Find the first port where "port-<num>" is NOT in the takenPorts list
        - name: targetPort
          variable:
            value: >-
              {{ allPorts[? !contains(takenPorts, join('', ['port-', @]))] | [0] }}

      # 4. Generate & Mutate (using targetPort)
      generate:
        apiVersion: coordination.k8s.io/v1
        kind: Lease
        name: "port-{{targetPort}}"
        # ... rest of generate block same as before ...

      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/containers/0/ports"
            value: 
            - containerPort: 51820
              hostPort: {{targetPort | to_number(@)}}
              protocol: UDP
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_EXTERNAL_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_LISTEN_PORT", "value": "{{targetPort}}"}
          - op: add
            path: "/spec/securityContext"
            value: {"sysctls": [{"name": "net.ipv4.ip_forward", "value": "1"}]}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-netbird-operator
  annotations:
    policies.kyverno.io/title: Restart netbird operator pod on secret update
    policies.kyverno.io/description: >-
      This policy requires the restart of netbird operator pod when the secret is updated
    argocd.argoproj.io/sync-wave: "0"
spec:
  rules:
    - name: add-annotation-on-secret-update
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - ${ARGOCD_ENV_netbird_operator_api_key_secret}
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  kyverno.platform.mojaloop.com/triggerrestart: "{{request.object.metadata.resourceVersion}}"
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: ${ARGOCD_ENV_netbird_operator_namespace}
            selector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-operator
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
  validationFailureAction: Audit
