apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nbrouter-add-security-context
  annotations:
    policies.kyverno.io/title: Add security context to nbrouter deployment
    policies.kyverno.io/description: >-
      This policy updates pod security context of nbrouter deployment
    argocd.argoproj.io/sync-wave: "0"

spec:
  rules:
    - name: nbrouter-add-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      mutate:
        patchJson6902: |-
          - op: add
            path: "/metadata/annotations/io.cilium.host-port-range"
            value: "50000-51000"
          - op: add
            path: "/metadata/annotations/io.cilium.host-port-protocol"
            value: "UDP"
          - op: add
            path: "/metadata/annotations/io.cilium.host-port-loose"
            value: "true"
          - op: add
            path: "/spec/containers/0/ports/0/hostPort"
            value: 0
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_EXTERNAL_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_LISTEN_PORT", "value": "51820"}
          - op: add
            path: "/spec/securityContext"
            value: {"sysctls": [{"name": "net.ipv4.ip_forward", "value": "1"}]}
      preconditions:
        any:
          - key: "{{request.operation}}"
            operator: In
            value: ["CREATE", "UPDATE"]
      skipBackgroundRequests: true
  validationFailureAction: Audit
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-netbird-operator
  annotations:
    policies.kyverno.io/title: Restart netbird operator pod on secret update
    policies.kyverno.io/description: >-
      This policy requires the restart of netbird operator pod when the secret is updated
    argocd.argoproj.io/sync-wave: "0"
spec:
  rules:
    - name: add-annotation-on-secret-update
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - ${ARGOCD_ENV_netbird_operator_api_key_secret}
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  kyverno.platform.mojaloop.com/triggerrestart: "{{request.object.metadata.resourceVersion}}"
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: ${ARGOCD_ENV_netbird_operator_namespace}
            selector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-operator
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
  validationFailureAction: Audit
