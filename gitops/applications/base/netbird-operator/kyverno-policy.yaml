apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nbrouter-port-leaser
spec:
  applyRules: All
  rules:
    # RULE 1: THE LOCK (Acts as a Mutex)
    - name: check-global-lock
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["netbird-op"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        - name: lockExists
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/netbird-op/leases/nb-router-lock"
            jmesPath: "metadata.name"
      validate:
        message: "Another router pod is currently being provisioned. Retrying..."
        deny:
          conditions:
            all:
            - key: "{{ lockExists }}"
              operator: NotEquals
              value: ""

    # RULE 2: THE PORT SELECTION & MUTATION
    - name: mutate-router-port
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["netbird-op"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        # 1. Fetch leases - we MUST use the literal empty array `[]` as a fallback
        - name: takenPorts
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/netbird-op/leases"
            jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name || `[]`"
        
        # 2. Logic - we use the || `[]` trick again inside the selection query
        - name: targetPort
          variable:
            value: >-
              {{ [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`, `51826`, `51827`, `51828`, `51829`][? !contains(takenPorts || `[]`, join('', ['port-', to_string(@)]))] | [0] }}

      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/containers/0/ports"
            value: 
            - containerPort: 51820
              hostPort: {{ targetPort | to_number(@) }}
              protocol: UDP
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_EXTERNAL_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}
          - op: add
            path: "/spec/containers/0/env/-"
            value: {"name": "NB_LISTEN_PORT", "value": "{{targetPort}}"}
          - op: add
            path: "/spec/securityContext"
            value: {"sysctls": [{"name": "net.ipv4.ip_forward", "value": "1"}]}

    # RULE 3: CREATE THE PORT LEASE
    - name: generate-port-lease
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["netbird-op"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      context:
        # 1. Fetch leases - we MUST use the literal empty array `[]` as a fallback
        - name: takenPorts
          apiCall:
            urlPath: "/apis/coordination.k8s.io/v1/namespaces/netbird-op/leases"
            jmesPath: "items[?metadata.labels.type=='nb-port-lease'].metadata.name || `[]`"
        
        # 2. Logic - we use the || `[]` trick again inside the selection query
        - name: targetPort
          variable:
            value: >-
              {{ [`51820`, `51821`, `51822`, `51823`, `51824`, `51825`, `51826`, `51827`, `51828`, `51829`][? !contains(takenPorts || `[]`, join('', ['port-', to_string(@)]))] | [0] }}
      generate:
        apiVersion: coordination.k8s.io/v1
        kind: Lease
        name: "port-{{targetPort}}"
        namespace: "netbird-op"
        synchronize: true
        data:
          metadata:
            labels:
              type: nb-port-lease
            ownerReferences:
            - apiVersion: v1
              kind: Pod
              name: "{{request.object.metadata.name}}"
              uid: "{{request.object.metadata.uid}}"
          spec:
            holderIdentity: "{{request.object.metadata.name}}"

    # RULE 4: CREATE THE GLOBAL MUTEX LOCK
    - name: generate-global-lock
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["netbird-op"]
              selector:
                matchLabels:
                  app.kubernetes.io/name: netbird-router
      generate:
        apiVersion: coordination.k8s.io/v1
        kind: Lease
        name: "nb-router-lock"
        namespace: "netbird-op"
        synchronize: true
        data:
          metadata:
            ownerReferences:
            - apiVersion: v1
              kind: Pod
              name: "{{request.object.metadata.name}}"
              uid: "{{request.object.metadata.uid}}"
          spec:
            holderIdentity: "{{request.object.metadata.name}}"
            leaseDurationSeconds: 10
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-netbird-operator
  annotations:
    policies.kyverno.io/title: Restart netbird operator pod on secret update
    policies.kyverno.io/description: >-
      This policy requires the restart of netbird operator pod when the secret is updated
    argocd.argoproj.io/sync-wave: "0"
spec:
  rules:
    - name: add-annotation-on-secret-update
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - ${ARGOCD_ENV_netbird_operator_api_key_secret}
              namespaces:
                - ${ARGOCD_ENV_netbird_operator_namespace}
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  kyverno.platform.mojaloop.com/triggerrestart: "{{request.object.metadata.resourceVersion}}"
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: ${ARGOCD_ENV_netbird_operator_namespace}
            selector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-operator
      preconditions:
        all:
          - key: "{{request.operation}}"
            operator: Equals
            value: UPDATE
      skipBackgroundRequests: true
  validationFailureAction: Audit
