---
apiVersion: pkg.crossplane.io/v1alpha1
kind: ControllerConfig
metadata:
  name: terraform-debug
  labels:
    app: crossplane-provider-terraform
spec:
  args:
    - -d
    - --poll=5m
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-terraform
spec:
  package: ghcr.io/mojaloop/infra/upbound/provider-terraform:v${ARGOCD_ENV_crossplane_providers_terraform_version}
  controllerConfigRef:
    name: terraform-debug
  runtimeConfigRef:
    name: provider-terraform-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-terraform-sa
subjects:
  - kind: ServiceAccount
    name: crossplane-terraform-sa
    namespace: crossplane-system
roleRef:
  name: crossplane-terraform-sa
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-terraform-sa
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-terraform-config
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          dnsConfig:
            options:
              - name: ndots
                value: "3"
              - name: attempts
                value: "5"
  serviceAccountTemplate:
    metadata:
      name: crossplane-terraform-sa
