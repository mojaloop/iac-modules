apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-toolbox-restart
  namespace: ${ARGOCD_ENV_gitlab_namespace}
spec:
  schedule: '20 * * * *' # Every 20th minute of every hour
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: restart-toolbox
              image: k8s.gcr.io/kubectl:v1.24.0
              command:
                - /bin/sh
                - -c
                - |
                  echo "Restarting gitlab-toolbox pod..."
                  kubectl -n gitlab rollout restart deployment gitlab-toolbox
