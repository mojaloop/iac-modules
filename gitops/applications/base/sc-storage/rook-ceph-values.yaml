csi:
  kubeletDirPath: /var/lib/kubelet
  serviceMonitor:
    enabled: false
    interval: 60s
enableDiscoveryDaemon: true
obcAllowAdditionalConfigFields: maxObjects,maxSize,bucketPolicy,bucketLifecycle
monitoring:
  enabled: true
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 64Mi
