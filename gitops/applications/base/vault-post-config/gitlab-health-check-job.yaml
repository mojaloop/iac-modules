apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-health-check
  namespace: ${ARGOCD_ENV_vault_namespace}
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  backoffLimit: 0  # No retries at Kubernetes level, we handle it inside the script
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: health-check
          image: curlimages/curl:7.88.1
          command:
            - sh
            - -c
            - |
              echo "⏳ Waiting for GITLAB to become healthy..."
              until [ "$(curl -s -o /dev/null -w '%{http_code}' https://gitlab.${ARGOCD_ENV_gitlab_dns_subdomain}/-/readiness)" = "200" ]; do
                echo "❌ GITLAB is not healthy yet. Retrying in 10s..."
                sleep 10
              done
              echo "✅ GITLAB is healthy! Proceeding with deployment."
