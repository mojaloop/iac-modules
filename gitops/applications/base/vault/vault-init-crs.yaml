---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: "${ARGOCD_ENV_vault_namespace}"
  name: vault-secret-all
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-secret-binding
  namespace: "${ARGOCD_ENV_vault_namespace}"
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: "${ARGOCD_ENV_vault_namespace}"
roleRef:
  kind: Role
  name: vault-secret-all
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: post-config
  namespace: "${ARGOCD_ENV_vault_namespace}"
data:
  bootstrap.sh: |
      #!/bin/bash
      export VAULT_ADDR=http://127.0.0.1:8200
      export VAULT_ROOT_TOKEN=""
      # Extract the ordinal index from the hostname (e.g., vault-0 -> 0)
      POD_ORDINAL=$${HOSTNAME##*-}

      echo "Waiting for Vault API to become responsive..."
      while true; do
        curl --insecure --connect-timeout 5 -s $VAULT_ADDR/v1/sys/health?sealedcode=204 > /dev/null && break
        sleep 2
      done

      # 1. Check if the secret already exists in Kubernetes
      SECRET_EXISTS=$(kubectl get secret -n "${ARGOCD_ENV_vault_namespace}" "${ARGOCD_ENV_vault_keys_secret}" --ignore-not-found)
      # get the root token from the secret if it exists
      if [ -n "$SECRET_EXISTS" ]; then
        VAULT_ROOT_TOKEN=$(kubectl get secret -n "${ARGOCD_ENV_vault_namespace}" "${ARGOCD_ENV_vault_keys_secret}" -o jsonpath="{.data.root_token}" | base64 --decode)
        echo "Vault keys secret already exists in Kubernetes."
      fi

      # if we have the root token then initialization is already done
      if [ -n "$VAULT_ROOT_TOKEN" ]; then
        echo "Vault is already initialized; moving to unseal step"
      else
        echo "Vault is not initialized. Proceeding with initialization..."
        # 2. Initialization Logic (Only for vault-0)
        if [ "$POD_ORDINAL" -eq "0" ] && [ -z "$VAULT_ROOT_TOKEN" ]; then
            if [ "$(vault status -format=json 2>/dev/null | jq -r '.initialized')" == "false" ]; then
              echo "vault-0: Initializing Vault..."
              vault operator init -key-shares=1 -key-threshold=1 -format=json > /tmp/output.json

              VAULT_ROOT_TOKEN=$(jq -r '.root_token' /tmp/output.json)
              UNSEAL_KEY=$(jq -r '.unseal_keys_b64[0]' /tmp/output.json)

              printf '{"token_name": "vault-provider-token", "token": "%s"}' "$VAULT_ROOT_TOKEN" > /tmp/creds.json

              echo "vault-0: Creating Kubernetes secret..."
              echo "{\"token\":\"$VAULT_ROOT_TOKEN\"}" > /tmp/creds.json
              kubectl create secret -n ${ARGOCD_ENV_vault_namespace} generic ${ARGOCD_ENV_vault_keys_secret} \
                --from-literal=unseal_key=$UNSEAL_KEY \
                --from-literal=root_token=$VAULT_ROOT_TOKEN \
                --from-file=creds=/tmp/creds.json \
                --from-file=vault-keys.json=/tmp/output.json \
                --from-file=creds=/tmp/creds.json \
                --save-config --dry-run=client -o yaml | kubectl apply -f -
            fi
        else
            echo "🛰️ VAULT-$POD_ORDINAL: Waiting for Auto-Join ..."

            # We don't run 'vault operator raft join'.
            # Instead, we wait for the node to become initialized,
            # which only happens AFTER it successfully joins the leader.
            for i in {1..30}; do
              # Redirect stderr to null so 'vault status' doesn't pollute the variable if it fails
              RAW_HEALTH=$(vault status -format=json 2>/dev/null)

              # If the command failed (exit code != 0), use the fallback
              if [ -z "$RAW_HEALTH" ]; then
                HEALTH='{"initialized": false}'
              else
                HEALTH="$RAW_HEALTH"
              fi

              # Extract the value cleanly
              IS_INIT=$(echo "$HEALTH" | jq -r '.initialized')

              echo "Debug: Initialized status is [$IS_INIT]"

              if [ "$IS_INIT" == "true" ]; then
                echo "✅ Node is joined to the cluster."
                break
              fi

              echo "⏳ Waiting for cluster membership... (Attempt $i/30)"
              sleep 6
            done
        fi
      fi

      # 3. Unseal Logic (All Pods)
      # Wait briefly for vault-0 to finish init if this is a follower pod
      sleep 5

      if [ "$(vault status -format=json 2>/dev/null | jq -r '.sealed')" == "true" ]; then
          echo "Pod $HOSTNAME: Vault is sealed. Attempting to unseal..."

          # Retrieve unseal key from the K8s secret
          FETCHED_UNSEAL_KEY=$(kubectl get secret -n ${ARGOCD_ENV_vault_namespace} ${ARGOCD_ENV_vault_keys_secret} -o jsonpath="{.data.unseal_key}" | base64 -d)

          if [ -n "$FETCHED_UNSEAL_KEY" ]; then
              vault operator unseal "$FETCHED_UNSEAL_KEY"
          else
              echo "Error: Unseal key not found in Kubernetes secret."
              exit 1
          fi
      else
          echo "Pod $HOSTNAME: Vault is already unsealed."
      fi
