# 15. VIRTUAL SERVICE (Istio routing)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pulp-virtual-service
  namespace: pulp-system
spec:
  gateways:
    - ${ARGOCD_ENV_pulp_istio_gateway_namespace}/${ARGOCD_ENV_pulp_istio_wildcard_gateway_name}
  hosts:
    - "pulp.${ARGOCD_ENV_pulp_dns_subdomain}"
  http:
  # Container registry routes
  - match:
    - uri:
        prefix: "/containers/"
    rewrite:
      uri: "/"
    route:
    - destination:
        host: pulp-pull-through-service.pulp-system.svc.cluster.local
        port:
          number: 8080
  
  # Helm repository routes
  - match:
    - uri:
        prefix: "/helm/"
    rewrite:
      uri: "/"
    route:
    - destination:
        host: pulp-pull-through-service.pulp-system.svc.cluster.local
        port:
          number: 8080
  
  # Ansible Galaxy routes
  - match:
    - uri:
        prefix: "/ansible/"
    rewrite:
      uri: "/"
    route:
    - destination:
        host: pulp-pull-through-service.pulp-system.svc.cluster.local
        port:
          number: 8080
  
  # API/management routes (optional)
  - match:
    - uri:
        prefix: "/pulp/api/"
    route:
    - destination:
        host: pulp-pull-through-service.pulp-system.svc.cluster.local
        port:
          number: 24817
---
