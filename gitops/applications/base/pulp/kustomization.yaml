apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: 
- virtualservice.yaml

helmCharts:
- name: pulp-operator
  releaseName: ${ARGOCD_ENV_pulp_app_name}
  version: ${ARGOCD_ENV_pulp_helm_version}
  repo: https://github.com/pulp/pulp-k8s-resources/raw/main/helm-charts/
  valuesFile: pulp-values.yaml
  namespace: ${ARGOCD_ENV_pulp_operator_namespace}
  includeCRDs: true