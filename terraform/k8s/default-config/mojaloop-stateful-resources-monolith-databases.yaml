common_platform_db:
  provider: in-cluster  # possbile values are rds, dbaas and in-cluster
  app_owner: "platform"
  resource_type: "mysql"
  externalservice_name: "common-platform-db"
  resource_namespace: "stateful-resources"  # Namespace where the resource will be created
  ca_bundle_secret:
    name: "global-ca-bundle-plat"
    key: "ca-bundle.crt"
  dbaas_resource_config:
    # Percona XtraDB Cluster (PXC) specific configurations
    management_policy: "*"
    cluster_name: "common-platform-db"                         # Name of the cluster
    cr_version: "1.18.0"                                       # Custom Resource version for the operator
    pxc_image: "percona/percona-xtradb-cluster:8.4.6-6.1"      # Docker image for the PXC nodes
    image_pull_policy: "IfNotPresent"                          # Image pull policy for the PXC nodes
    mysql_storage_size: "30Gi"                                 # Storage size for MySQL data
    mysql_replicas: 1                                          # Number of MySQL replicas in the cluster
    mysql_requests_memory: "512Mi"                             # Memory request for MySQL pods
    mysql_requests_cpu: "300m"                                 # CPU request for MySQL pods
    mysql_limits_memory: "16Gi"                                # Memory limit for MySQL pods
    mysql_limits_cpu: "16000m"                                 # CPU limit for MySQL pods

    # HAProxy specific configurations (for load balancing)
    haproxy_image: "percona/haproxy:2.8.15"                      # Docker image for the HAProxy instances
    haproxy_expose: "true"                                       # Whether HAProxy should be exposed
    haproxy_replicas: 1                                          # Number of HAProxy replicas
    haproxy_requests_memory: "512Mi"                             # Memory request for HAProxy pods
    haproxy_requests_cpu: "100m"                                 # CPU request for HAProxy pods
    haproxy_limits_memory: "1Gi"                                 # Memory limit for HAProxy pods
    haproxy_limits_cpu: "1000m"                                  # CPU limit for HAProxy pods

    # Log Collector specific configurations
    logcollector_image: "percona/percona-xtradb-cluster-operator:1.17.0-logcollector-fluentbit4.0.0"  # Image for log collector
    logcollector_requests_memory: "200Mi"                        # Memory request for log collector
    logcollector_requests_cpu: "100m"                            # CPU request for log collector
    logcollector_limits_memory: "512Mi"                          # Memory limit for log collector
    logcollector_limits_cpu: "200m"                              # CPU limit for log collector

    # Backup specific configurations
    enable_backup: true
    backup_image: "percona/percona-xtrabackup:8.0.35-34.1"       # Docker image for the backup tool
    backup_verify_tls: "true"
    backup_schedule_name: "daily_backup"                         # Name for the backup schedule
    backup_cron_schedule: "0 0 * * *"                            # Cron expression for daily backup at midnight
    backup_retention: "3"                                        # Number of backups to retain
    backup_pvc: {}
    pxc_annotations: {}
    pxc_volume_spec: {}
    mysql_config: |
        [mysqld]
        pxc_strict_mode=PERMISSIVE
        max_allowed_packet=16M
        bind-address="*"
        character-set-server=UTF8
        collation-server=utf8_general_ci
        general_log=0
        slow_query_log=0
        long_query_time=10
        innodb_use_native_aio=0
        max_connections=2000
        innodb_buffer_pool_size=2147483648
        wsrep_auto_increment_control=OFF
        coredumper=/tmp/mysql-core-dump
        innodb_buffer_pool_in_core_file=OFF
        mysql_native_password=ON
        require_secure_transport=ON
        skip-log-bin
        wsrep_provider_options="allocator.disk_pages_encryption = no; allocator.encryption_cache_page_size = 32K; allocator.encryption_cache_size = 16777216; base_dir = /var/lib/mysql/; base_host = 10.244.100.38; base_port = 4567; cert.log_conflicts = no; cert.optimistic_pa = no; debug = no; evs.auto_evict = 0; evs.causal_keepalive_period = PT1S; evs.debug_log_mask = 0x1; evs.delay_margin = PT1S; evs.delayed_keep_period = PT30S; evs.inactive_check_period = PT0.5S; evs.inactive_timeout = PT15S; evs.info_log_mask = 0; evs.install_timeout = PT7.5S; evs.join_retrans_period = PT1S; evs.keepalive_period = PT1S; evs.max_install_timeouts = 3; evs.send_window = 10; evs.stats_report_period = PT1M; evs.suspect_timeout = PT5S; evs.use_aggregate = true; evs.user_send_window = 4; evs.version = 1; evs.view_forget_timeout = P1D; gcache.dir = /var/lib/mysql/; gcache.encryption = no; gcache.encryption_cache_page_size = 32K; gcache.encryption_cache_size = 16777216; gcache.freeze_purge_at_seqno = -1; gcache.keep_pages_count = 0; gcache.keep_pages_size = 0; gcache.mem_size = 0; gcache.name = galera.cache; gcache.page_size = 1G; gcache.recover = yes; gcache.size = 1G; gcomm.thread_prio = ; gcs.fc_auto_evict_threshold = 0.75; gcs.fc_auto_evict_window = 0; gcs.fc_debug = 0; gcs.fc_factor = 1.0; gcs.fc_limit = 250; gcs.fc_master_slave = no; gcs.fc_single_primary = no; gcs.max_packet_size = 64500; gcs.max_throttle = 0.25; gcs.recv_q_hard_limit = 9223372036854775807; gcs.recv_q_soft_limit = 0.25; gcs.sync_donor = no; gmcast.listen_addr = ssl://0.0.0.0:4567; gmcast.mcast_addr = ; gmcast.mcast_ttl = 1; gmcast.peer_timeout = PT3S; gmcast.segment = 0; gmcast.time_wait = PT5S; gmcast.version = 0; ist.recv_addr = 10.244.100.38; pc.announce_timeout = PT3S; pc.checksum = false; pc.ignore_quorum = false; pc.ignore_sb = false; pc.linger = PT20S; pc.npvo = false; pc.recovery = true; pc.version = 0; pc.wait_prim = true; pc.wait_prim_timeout = PT30S; pc.wait_restored_prim_timeout = PT0S; pc.weight = 10; p