---
- name: participant-view
  match_path: /central-admin/participants<.*>
  match_methods:
    - GET
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: participantView

- name: position-funds-in-out
  match_path: /central-admin/participants/<.*>/accounts<.*>
  match_methods:
    - POST
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: positionFundsInOut

- name: position-ndc-edit
  match_path: /central-admin/participants/<.*>/limits
  match_methods:
    - PUT
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: positionNDCEdit

- name: participant-disable-enable
  match_path: /central-admin/participants/<.*>/accounts<.*>
  match_methods:
    - PUT
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: participantDisableEnable

- name: settlement-view
  match_path: /settlement<.*>
  match_methods:
    - GET
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: settlementView

- name: settlement-initiate-finalize
  match_path: /settlements<.*>
  match_methods:
    - POST
    - PUT
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: settlementInitiateFinalise

- name: settlement-close-window
  match_path: /settlementWindows<.*>
  match_methods:
    - POST
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: settlementCloseWindow

- name: iam-view
  match_path: /<(users|participants|roles)(/.*)?>
  match_methods:
    - GET
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: iamView

- name: iam-edit
  match_path: /<(users|participants|roles)(/.*)?>
  match_methods:
    - POST
    - PUT
    - DELETE
    - PATCH
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: iamEdit

- name: reporting-api
  match_path: /api/reports/<.*> # todo
  match_methods:
    - GET
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: reportingApi

- name: transfer-api
  match_path: /api/transfers # todo
  match_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: transferApi

- name: transfer-api2
  match_path: /api/transfers/graphql # todo
  match_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: transferApi

- name: settlementModel-view
  match_path: /central-admin/settlementModels<.*>
  match_methods:
    - GET
  authenticator_handlers:
  - jwt
  - cookie_session
  authorizer_permission: settlementView

