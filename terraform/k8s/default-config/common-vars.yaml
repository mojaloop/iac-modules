crossplane_packages_aws_rds_version: "v0.4.0"
crossplane_packages_sc_mysql_version: "v0.9.0-pr127-26755702863"
crossplane_packages_sc_mongodb_version: "v0.6.0"
max_pods_per_node: 110
velero_plugin_version: 'v1.12.1'
velero_helm_version: '10.0.1'
velero_backup_schedule: '0 0 * * *'
velero_backup_ttl: '720h0m0s'
keto_replica_count: 1
oathkeeper_replica_count: 1
keycloak_replica_count: 1
loki_canary_chart_version: 0.14.0
loki_canary_repo: https://grafana.github.io/helm-charts
internal_cc_hosts: 'vault,grafana,loki,mimir,traces'
internal_sc_hosts: 'cephobjectstore'
netbird_target_labels: 'app=rook-ceph-operator,app=csi-rbdplugin-provisioner,app=csi-rbdplugin,app=csi-cephfsplugin-provisioner,app=csi-cephfsplugin,gateway.networking.k8s.io/gateway-name=nb-egress-waypoint'
opt_out_namespace_list: 'strimzi,storage'
netbird_image_version: '0.66.0'
netbird_operator_helm_version: '0.1.15'
kyverno_chart_version: '3.5.2'
vault_backup_schedule: "0 */12 * * *" # Every 12 hours
vault_backupjob_image: "ghcr.io/mojaloop/vault-utils:0.0.8"
grafana_dashboard_tag_iac_modules: "feature/storage-cluster"
monitoring_workload_tolerations: []
#  - key: "workload-class.mojaloop.io/MONITORING"
#    operator: "Equal"
#    value: "enabled"
#    effect: "NoSchedule"
netbird_taint_remover_enabled: true
vault_readiness_timeout_seconds: 15
openebs_helm_version: '4.4.0'
namespaces_to_central_loki: "mojaloop|moja-kafka"
log_alert_patterns:
  connection-refused:
    regex: "(?i)connection refused|ECONNREFUSED"
    description: "Connection refused error detected"
    threshold: 1
    severity: "warning"
