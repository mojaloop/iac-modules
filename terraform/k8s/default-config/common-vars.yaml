loki_chart_version: 6.45.2
loki_ingester_pvc_size: 10Gi
prometheus_pvc_size: 50Gi
loki_ingester_retention_period: 72h
loki_ingester_max_chunk_age: 2h
loki_ingester_replication_factor: '1'
loki_distributor_replica_count: '2'
loki_ingester_replica_count: '3' # loki_ingester_replica_count should be >= loki_ingester_replication_factor
loki_querier_replica_count: '2'
loki_distributor_requests_cpu: "100m"
loki_distributor_requests_memory: "128Mi"
loki_distributor_limits_cpu: "150m"
loki_distributor_limits_memory: "192Mi"
loki_ingester_requests_cpu: "100m"
loki_ingester_requests_memory: "256Mi"
loki_ingester_limits_cpu: "500m"
loki_ingester_limits_memory: "1Gi"
loki_querier_limits_cpu: "500m"
loki_querier_limits_memory: "192Mi"
loki_query_frontend_limits_cpu: "150m"
loki_query_frontend_limits_memory: "192Mi"
loki_query_scheduler_limits_cpu: "150m"
loki_query_scheduler_limits_memory: "192Mi"
loki_compactor_limits_cpu: "150m"
loki_compactor_limits_memory: "192Mi"
alloy_limits_memory: "1Gi"
alloy_limits_cpu: "2000m" # Helps avoid CPU throttling during spikes
prometheus_scrape_interval: 5m
prometheus_rate_interval: 15m
prometheus_retention_period: 10d
prometheus_limits_cpu: "1000m"
prometheus_limits_memory: "6Gi"
prometheus_requests_cpu: "500m"
prometheus_requests_memory: "1Gi"
tempo_retention_period: 72h
istio_egress_gateway_max_replicas: 5
microk8s_version: 1.31/stable
microk8s_allow_patch_updates: false
alertmanager_enabled: true
alertmanager_limits_cpu: "200m"
alertmanager_limits_memory: "512Mi"
alertmanager_requests_cpu: "100m"
alertmanager_requests_memory: "128Mi"
alertmanager_prod_alerts_enabled: false # if false, alerts are sent to dev alerts slack channel
alertmanager_slack_integration_enabled: false
alertmanager_jira_integration_enabled: false
istio_proxy_log_level: warn
longhorn_backup_job_enabled: false
enable_central_observability_write: false # enables only metrics to be sent to mimir
enable_central_observability_read: false
enable_central_loki_write: true # enables only metrics to be sent to central loki
coredns_localcache_version: '1.12.1'
aws_ebs_csi_driver_helm_version: '2.39.0'
aws_ebs_csi_driver_replicas: 2
