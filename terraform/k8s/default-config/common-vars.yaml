crossplane_providers_aws_iam_version: "1.21.0"
crossplane_providers_aws_s3_version: "1.21.0"
crossplane_providers_aws_docdb_version: "1.21.0"
crossplane_providers_aws_rds_version: "1.21.0"
crossplane_providers_aws_route53_version: "1.21.0"
crossplane_providers_aws_ec2_version: "1.21.0"
crossplane_providers_k8s_version: "0.18.0"
crossplane_providers_vault_version: "2.1.1"
crossplane_functions_patch_and_transform_version: "0.8.2"
crossplane_functions_go_templating_version: "0.8.0"
crossplane_functions_kcl_version: "0.11.3"
