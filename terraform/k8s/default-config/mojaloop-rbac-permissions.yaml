  - dfspCertificatesView
  - dfspCertificatesManage
  - dfspEndpointsView
  - dfspEndpointsManage
  - dfspServerCertsView
  - dfspServerCertsManage
  - dfspEnrollmentsView
  - dfspEnrollmentsManage
  - dfspOnboard
  - dfspEndpointConfirmation
  # JWS Certificates (full access) 
  - jwsCertificatesView
  - jwsCertificatesManage
  # Monetary zones
  - monetaryZonesView
  # Admin permissions
  - iamView

- rolename: everyone
  permissions:
  # Basic authenticated access
  - basicAccess
  # Read-only access to basic endpoints
  - hubEndpointsView
  - dfspStatusView

# DFSP-specific role template (actual DFSP roles are created dynamically)
- rolename: dfsp
  permissions:
  # DFSP can only access their own resources
  - basicAccess
  - dfspSelfAccess
  - dfspCredentialsManage
  - dfspSelfCertificatesView
  - dfspSelfEndpointsView
  - dfspSelfServerCertsView
  - dfspSelfStatusView

# Legacy MCM admin role (expanded)
- rolename: mcmadmin
  permissions:
