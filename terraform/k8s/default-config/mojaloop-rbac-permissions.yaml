# MCM Roles - Based on OpenAPI schema analysis
- rolename: mta
  permissions:
  # General MCM API access
  - mcmApi
  - basicAccess
  # Hub management (full access)
  - hubEndpointsView
  - hubEndpointsManage
  - hubCertificatesView
  - hubCertificatesManage
  - hubServerCertsView
  - hubServerCertsManage
  # DFSP management (full access)
  - dfspList
  - dfspView
  - dfspManage
  - dfspAccess
  - dfspCertificatesView
  - dfspCertificatesManage
  - dfspEndpointsView
  - dfspEndpointsManage
  - dfspServerCertsView
  - dfspServerCertsManage
  - dfspEnrollmentsView
  - dfspEnrollmentsManage
  - dfspOnboard
  # JWS Certificates (full access)
  - jwsCertificatesView
  - jwsCertificatesManage
  # Monetary zones
  - monetaryZonesView
  # Admin permissions
  - iamView
  - iamEdit

- rolename: pta
  permissions:
  # General MCM API access
  - mcmApi
  - basicAccess
  # Hub management (full access)
  - hubEndpointsView
  - hubEndpointsManage
  - hubCertificatesView
  - hubCertificatesManage
  - hubServerCertsView
  - hubServerCertsManage
  # DFSP management (full access)
  - dfspList
  - dfspView
