name: "🏷️ Semantic Tag"

on:
  push:
    branches:
      - feature/storage-cluster

permissions:
  contents: write

concurrency:
  group: semantic-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-semantic-tag:
    name: "Create next semantic tag"
    runs-on: ubuntu-latest
    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔎 Determine semantic title"
        id: semantic-title
        shell: bash
        run: |
          set -euo pipefail

          allowed_types="build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test"
          title_regex="^(${allowed_types})(\([A-Za-z0-9._/-]+\))?(!)?:[[:space:]].+"

          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%b)"

          echo "::group::Latest commit subject"
          echo "${subject}"
          echo "::endgroup::"

          semantic_title=""
          semantic_title_source=""

          # Squash merges usually put the PR title directly in the commit subject.
          if [[ "${subject}" =~ ${title_regex} ]]; then
            semantic_title="${subject}"
            semantic_title_source="commit subject"
          else
            # Normal GitHub merge commits commonly put the PR title in the body.
            while IFS= read -r line; do
              line="${line%$'\r'}"
              if [[ "${line}" =~ ${title_regex} ]]; then
                semantic_title="${line}"
                semantic_title_source="commit body"
                break
              fi
            done <<< "${body}"
          fi

          if [[ -z "${semantic_title}" ]]; then
            echo "::error title=Invalid semantic title::The latest commit does not contain an approved Conventional Commit title."
            {
              echo "## ❌ Semantic title rejected"
              echo
              echo "The latest commit on \`feature/storage-cluster\` does not contain an approved Conventional Commit title."
              echo
              echo "The semantic tag workflow reads the squash commit subject first, then scans the merge commit body."
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Commit subject | \`${subject}\` |"
              echo "| Target branch | \`feature/storage-cluster\` |"
              echo
              echo "### Required format"
              echo
              echo "- \`<type>: <description>\`"
              echo "- \`<type>(scope): <description>\`"
              echo "- \`<type>!: <description>\`"
              echo "- \`<type>(scope)!: <description>\`"
              echo
              echo "### Allowed types"
              echo
              echo "\`build\`, \`chore\`, \`ci\`, \`docs\`, \`feat\`, \`fix\`, \`perf\`, \`refactor\`, \`revert\`, \`style\`, \`test\`"
              echo
              echo "### Examples"
              echo
              echo "- \`fix: correct storage class selector\`"
              echo "- \`feat: add storage cluster backup support\`"
              echo "- \`refactor!: change Helm values structure\`"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if [[ "${semantic_title}" =~ ${title_regex} ]]; then
            commit_type="${BASH_REMATCH[1]}"
            breaking_marker="${BASH_REMATCH[3]-}"
          else
            echo "::error title=Invalid semantic title::Unexpected validation failure while parsing semantic title."
            exit 1
          fi

          if [[ "${breaking_marker}" == "!" ]]; then
            bump="major"
          elif [[ "${commit_type}" == "feat" ]]; then
            bump="minor"
          else
            bump="patch"
          fi

          {
            echo "semantic_title=${semantic_title}"
            echo "semantic_title_source=${semantic_title_source}"
            echo "commit_type=${commit_type}"
            echo "bump=${bump}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## ✅ Semantic title accepted"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Title | \`${semantic_title}\` |"
            echo "| Source | ${semantic_title_source} |"
            echo "| Type | \`${commit_type}\` |"
            echo "| Bump | \`${bump}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "✅ Using semantic title from ${semantic_title_source}: ${semantic_title}"
          echo "📈 Selected ${bump} bump."

      - name: "🧮 Calculate next semantic tag"
        id: next-tag
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Fetch tags"
          git fetch --force --tags origin
          echo "::endgroup::"

          valid_tag_regex="^v[0-9]+\.[0-9]+\.[0-9]+$"
          latest_tag="$(git tag --list | grep -E "${valid_tag_regex}" | sort -V | tail -n 1 || true)"

          if [[ -z "${latest_tag}" ]]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS="." read -r major minor patch <<< "${version}"

          case "${{ steps.semantic-title.outputs.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "::error title=Invalid bump type::Unsupported bump type '${{ steps.semantic-title.outputs.bump }}'."
              exit 1
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/${next_tag}" >/dev/null; then
            echo "::error title=Duplicate semantic tag::Calculated tag ${next_tag} already exists."
            exit 1
          fi

          {
            echo "latest_tag=${latest_tag}"
            echo "next_tag=${next_tag}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## 🧮 Version calculation"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Latest valid tag | \`${latest_tag}\` |"
            echo "| Bump | \`${{ steps.semantic-title.outputs.bump }}\` |"
            echo "| Next tag | \`${next_tag}\` |"
            echo
            echo "Only exact \`vX.Y.Z\` tags are used as the base version."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "🏷️ Latest valid semantic tag: ${latest_tag}"
          echo "🚀 Next semantic tag: ${next_tag}"

      - name: "🚀 Create and push semantic tag"
        shell: bash
        run: |
          set -euo pipefail

          next_tag="${{ steps.next-tag.outputs.next_tag }}"

          git tag "${next_tag}"
          git push origin "refs/tags/${next_tag}"

          {
            echo "## 🚀 Tag published"
            echo
            echo "Created and pushed \`${next_tag}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "🚀 Created and pushed ${next_tag}."

      - name: "📝 Create GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          next_tag="${{ steps.next-tag.outputs.next_tag }}"

          if gh release view "${next_tag}" >/dev/null 2>&1; then
            echo "::error title=Duplicate release::Release ${next_tag} already exists."
            exit 1
          fi

          gh release create "${next_tag}" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "${next_tag}"

          {
            echo "## 📝 Release published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release | \`${next_tag}\` |"
            echo "| Latest | yes |"
            echo "| Notes | generated automatically |"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "📝 Published latest release ${next_tag} with generated release notes."
